# Backup diário do banco Supabase (funciona no plano gratuito).
#
# Exporta o banco com pg_dump, criptografa com uma senha (AES-256) e guarda
# como artifact do GitHub por 90 dias. Se falhar, o GitHub manda e-mail.
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL  connection string do "Session pooler" (porta 5432)
#   BACKUP_PASSWORD  senha usada para criptografar (guarde num lugar seguro!)
#
# Ao final, registra o resultado na tabela backup_historico (migration 048),
# exibida no bloco "Backup" da tela Início.
#
# Como baixar e restaurar: veja a seção "Backup" do README.md.

name: Backup diário

on:
  schedule:
    # Todo dia às 06:00 UTC (03:00 em Brasília)
    - cron: "0 6 * * *"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Marcar início
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: Instalar cliente PostgreSQL 17
        # pg_dump precisa ser da mesma versão do servidor ou mais novo
        run: |
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Exportar banco
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ]; then echo "::error::Secret SUPABASE_DB_URL não configurado"; exit 1; fi
          PG=/usr/lib/postgresql/17/bin
          STAMP=$(date -u +%Y-%m-%d)
          DIR="backup-$STAMP"
          mkdir "$DIR"

          # 1. Schema public completo (tabelas, dados, funções, triggers, políticas RLS)
          "$PG/pg_dump" "$DB_URL" --schema=public --no-owner --no-privileges \
            --format=custom --file="$DIR/public.dump"

          # 2. Mesmo conteúdo em SQL puro (legível; útil para consultar sem restaurar)
          "$PG/pg_dump" "$DB_URL" --schema=public --no-owner --no-privileges \
            --file="$DIR/public.sql"

          # 3. Usuários do login (as tabelas usam user_id → auth.users)
          "$PG/pg_dump" "$DB_URL" --data-only \
            --table=auth.users --table=auth.identities \
            --file="$DIR/auth_users.sql"

          ls -la "$DIR"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - name: Compactar e criptografar
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_PASSWORD" ]; then echo "::error::Secret BACKUP_PASSWORD não configurado"; exit 1; fi
          tar -czf "$DIR.tar.gz" "$DIR"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSWORD" \
            --symmetric --cipher-algo AES256 --output "$DIR.tar.gz.gpg" "$DIR.tar.gz"
          rm -rf "$DIR" "$DIR.tar.gz"
          ls -la "$DIR.tar.gz.gpg"
          echo "TAMANHO=$(stat -c %s "$DIR.tar.gz.gpg")" >> "$GITHUB_ENV"

      - name: Guardar backup (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.STAMP }}
          path: ${{ env.DIR }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error

      - name: Registrar no histórico
        # Roda mesmo se algum passo anterior falhou, para registrar a falha
        if: always()
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STATUS: ${{ job.status == 'success' && 'sucesso' || 'falha' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PSQL=/usr/lib/postgresql/17/bin/psql
          if [ -z "$DB_URL" ] || [ ! -x "$PSQL" ]; then
            echo "::warning::Não foi possível registrar no histórico (sem conexão ou psql)"
            exit 0
          fi
          DURACAO=$(( $(date +%s) - ${INICIO:-$(date +%s)} ))
          MSG=""
          if [ "$STATUS" = "falha" ]; then MSG="Falhou. Veja o log no GitHub."; fi
          "$PSQL" "$DB_URL" -v ON_ERROR_STOP=1 \
            -v status="$STATUS" -v tamanho="${TAMANHO:-}" -v duracao="$DURACAO" \
            -v url="$RUN_URL" -v msg="$MSG" <<'SQL'
          INSERT INTO backup_historico (status, tamanho_bytes, duracao_segundos, run_url, mensagem)
          VALUES (:'status', NULLIF(:'tamanho', '')::bigint, :'duracao'::int, :'url', NULLIF(:'msg', ''));
          SQL
